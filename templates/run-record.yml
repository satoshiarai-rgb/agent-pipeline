# 実行レコードの雛形。1 実行 1 ファイルで agent-work/issue-<n>/runs/ に作る。
# ファイル名は <agent>-<run_id>-<attempt>.yml。
#
# 1 行のカウンタを共有しないため、並行した push でも rebase が両方を保持し、
# 「どちらの実行も書いていない値」が生まれない（A-33）。
# このファイル群がそのまま実行履歴になり、log.md は completing で連結して生成する（A-34）。

agent: planner # planner | plan-reviewer | developer | dev-reviewer | completion
phase: planning # 実行時のフェーズ
run_id: "33858903691" # GitHub Actions のラン ID
attempt: 1 # 再実行の回数（GITHUB_RUN_ATTEMPT）

started_at: 2026-09-04T10:00:00Z
# 実行前に書いて push し、完了後に埋める。
# 空のままのレコードは「実行中」を意味し、落ちた run は stale 検知が拾う（A-14）
finished_at: null

result: null # ok | invalid | agent_failed | api_error
verdict: null # レビュアーのみ: approve | request_changes
api_error_status: null # api_error のとき HTTP ステータスを残す（設定ミスと区別する / A-31）

model: claude-opus-5
session_id: null # --resume で追跡できるようにハーネスが記録する
