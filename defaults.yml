# ハーネスの既定値。型と読み込みは src/utils/load-config.ts。
# 配布先の .agent/config.yml による上書き（深いマージ、null は継承、未知キーはエラー）は
# 2 リポジトリに分離する Step B-5 で実装する（A-19）。それまでこのファイルが唯一の設定

pipeline_version: 1

models:
  default: claude-opus-5
  reviewer: null # null なら default と同じ

limits:
  plan_review_rounds: 2
  dev_review_rounds: 2
  total_steps: 12 # 自走ループの最終防波堤。正常系は 6〜8 で終わる

# ツールは 2 プロファイルに寄せる（A-30）。
# エージェントごとに集合を変えるとプロンプトキャッシュのプレフィックスが分かれるため。
# --tools は「利用可能なツールを絞る」指定で、実測でコンテキストからも消える（V-15）。
tool_profiles:
  readonly: Read,Glob,Grep,Write
  exec: Read,Glob,Grep,Write,Edit,Bash

agents:
  planner:
    max_turns: 25
    timeout_minutes: 20
    tools: readonly
  plan-reviewer:
    max_turns: 15
    timeout_minutes: 15
    tools: readonly
  developer:
    max_turns: 40
    timeout_minutes: 45
    tools: exec
  dev-reviewer:
    max_turns: 20
    timeout_minutes: 20
    tools: exec
  completion:
    max_turns: 15
    timeout_minutes: 15
    tools: exec

# /approve と agent:go ラベルを受け付ける author_association。
# 個人アカウント配下では MEMBER が返らないため COLLABORATOR を使う（K-1）
approvers:
  - OWNER
  - COLLABORATOR


# 遷移表。遷移を変えるときにコードを触らないよう宣言的に持つ。
# agent が無いエントリはエージェントを起動しない（人間が起こす遷移）。
# done / blocked は行き先を持たない終端。
transitions:
  planning:
    agent: planner
    on_ok: plan_review
  plan_review:
    agent: plan-reviewer
    round_key: plan_review
    on_approve: awaiting_human
    on_request_changes: planning
  developing:
    agent: developer
    on_ok: dev_review
  dev_review:
    agent: dev-reviewer
    round_key: dev_review
    on_approve: completing
    on_request_changes: developing
  completing:
    agent: completion
    on_pass: done
    on_fail: blocked
  # 人間のコメントで進む/戻る。エージェントは動かさない（設計書 §6.5）
  awaiting_human:
    on_approval: developing # /approve
    on_request_changes: planning # /request-changes: コメント本文を人間のレビューとして残す
    review_kind: plan # 人間が見ているのは plan.md
  # done は終端。PR を見た人間がコードに変更を求める経路は用意しない。
  # 作り直しが必要なら新しい issue を立てる（設計書 §1: マージまでが責務）
