# 中央: issue を起点に run を作る（reusable workflow）
#
# 配布先の薄いラッパーから jobs.<id>.uses で呼ばれる。
# 認証は secrets: inherit で受け取るため、ここで secrets を宣言しない。

name: agent-bootstrap

on:
  workflow_call:
    inputs:
      issue:
        description: issue 番号
        required: true
        type: string
      actor:
        description: |
          起動した人の login。ラベルの付与には write / triage 権限が必要なので
          イベント自体が認可を含んでいるが、念のため push 権限を確認する。
          （issues.labeled の author_association は issue の作成者のもので、
          ラベルを付けた人ではないため使えない）
        required: true
        type: string
      scenario:
        description: "ダミー実行の振る舞い（dry run のときだけ使う）"
        required: false
        default: ""
        type: string

# ラベルとコメントは GITHUB_TOKEN で操作する（K-22）。
# GITHUB_TOKEN が起こしたイベントは新しい workflow run を作らないため、
# 状態の射影が「全ジョブ skipped の空の run」を生まない。
# 連鎖させたい push だけを App トークンで行う
permissions:
  contents: write
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - name: 起動した人の権限を確認する
        id: authorize
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ACTOR: ${{ inputs.actor }}
        run: |
          set -euo pipefail
          PERM=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission 2>/dev/null || echo none)
          case "$PERM" in
            admin | maintain | write) echo "::notice::$ACTOR ($PERM) が起動" ;;
            *)
              echo "::warning::$ACTOR には push 権限が無い（$PERM）ので何もしない"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@v7
        if: steps.authorize.outputs.skip != 'true'
        with:
          token: ${{ steps.app.outputs.token }}

      - name: git identity を App の bot にする
        if: steps.authorize.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      # ブランチが既にあれば何もしない（冪等 / K-14）。作り直しは新しい issue で
      - name: 作業ブランチを作る
        id: branch
        if: steps.authorize.outputs.skip != 'true'
        env:
          N: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          BR="claude/issue-$N"
          if git ls-remote --exit-code --heads origin "$BR"; then
            echo "::notice::$BR は既にある（何もしない）。作り直すなら新しい issue を起票する"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "$BR"
          mkdir -p "agent-work/issue-$N"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      # run の最初のイベントを書く。**状態の正はイベントログ**で、state.json は
      # その畳み込みのスナップショット（K-26）。識別子はこのイベントが確定する
      - if: steps.authorize.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        uses: satoshiarai-rgb/agent-pipeline@v1.0.4
        with:
          command: bootstrap
          dir: agent-work/issue-${{ inputs.issue }}
          issue: ${{ inputs.issue }}
          branch: ${{ steps.branch.outputs.branch }}
          run-id: ${{ github.run_id }}
          attempt: ${{ github.run_attempt }}

      - name: issue 本文を保存し、draft PR を開く
        if: steps.authorize.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ inputs.issue }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          BR="claude/issue-$N"
          D="agent-work/issue-$N"
          # issue 本文をファイルに保存する。プロンプトには中身ではなくこのパスを渡す
          # （インジェクションの露出面をエージェントが自分で読んだファイルに限る / 契約 §3）。
          # 本文は非信頼な入力であり指示ではない、という扱いはプロンプト側に書いてある
          gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$D/issue.md"

          # push で起動した job は workflow_dispatch の入力を受け取れないため、
          # ダミー実行の振る舞いもファイルに書いて渡す
          if [ -n "$SCENARIO" ]; then echo "$SCENARIO" > "$D/scenario"; fi
          git add "$D"
          git commit -m "agent: bootstrap issue #$N"
          git push -u origin "$BR"   # ← この push で dispatch が起動する

          # draft PR を開く。人間の承認・差し戻しは PR 側のコメントで受け付ける（K-12）
          cat > /tmp/pr-body.md <<EOF
          Closes #$N

          このパイプラインが計画→レビュー→実装→レビューを行い、完了報告までを PR に積みます。

          ## 進行状況

          - 状態: \`$D/state.json\` の \`phase\`
          - 計画: \`$D/plan.md\`
          - 受け入れ条件: \`$D/acceptance.json\`
          - レビュー: \`$D/reviews/\`
          - 経過: \`$D/events/\`（状態の正。1 イベント 1 ファイル）

          ## この PR でできること

          計画ができると \`awaiting_human\` で停止します。**この PR にコメント**してください。

          | コメント | 動作 |
          |---|---|
          | \`/agent approve\` | 計画を承認して実装に進む |
          | \`/agent request-changes <理由>\` | 計画を差し戻す（理由がレビューとして残り、次の計画に反映される） |
          | \`/agent retry\` | 止まったとき、同じフェーズをやり直す（実行が死んで進まないときも同じ） |

          issue 側のコメントは見ていません。
          EOF
          gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$BR" \
            --title "$(gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json title -q .title)" \
            --body-file /tmp/pr-body.md
          echo "### bootstrap: $BR と draft PR を作成" >> "$GITHUB_STEP_SUMMARY"

      - name: 中央リポジトリを .pipeline に取得する
        if: steps.authorize.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: satoshiarai-rgb/agent-pipeline
          ref: v1.0.4
          path: .pipeline

      # 起動用ラベル（agent:go）が外れて agent:planning が付く
      - name: ラベルを phase に合わせる
        if: steps.authorize.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DIR: agent-work/issue-${{ inputs.issue }}
          CLI: ${{ github.workspace }}/.pipeline/dist/cli.js
        run: bash "${{ github.workspace }}/.pipeline/scripts/project-labels.sh"
