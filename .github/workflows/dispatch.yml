# 中央: push を受けて次のエージェントを決め、実行して遷移させる（reusable workflow）
#
# route ジョブが状態を読んで判断し、run ジョブが実行と遷移を担う。
# 状態を書くのはこのワークフローだけで、エージェントは書かない（設計書 §7.1）。

name: dispatch

on:
  workflow_call:
    inputs:
      dry_run:
        description: |
          true ならエージェントを呼ばず、フェーズごとのダミー成果物を書く。
          新しい配布先を導入するとき、トークンを使わずに配線を確認できる（設計書 §9-9）。
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ------------------------------------------------- 次に何をするか決める
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.route.outputs.action }}
      agent: ${{ steps.route.outputs.agent }}
      phase: ${{ steps.route.outputs.phase }}
      reason: ${{ steps.route.outputs.reason }}
      model: ${{ steps.route.outputs.model }}
      max_turns: ${{ steps.route.outputs.max_turns }}
      tools: ${{ steps.route.outputs.tools }}
      timeout_minutes: ${{ steps.route.outputs.timeout_minutes }}
      job_timeout_minutes: ${{ steps.route.outputs.job_timeout_minutes }}
      claude_args: ${{ steps.route.outputs.claude_args }}
      dir: ${{ steps.dir.outputs.dir }}
    steps:
      - uses: actions/checkout@v7

      - id: dir
        run: |
          set -euo pipefail
          # ブランチ名から run のディレクトリを決める（claude/issue-1 -> agent-work/issue-1）
          echo "dir=agent-work/${GITHUB_REF_NAME#claude/}" >> "$GITHUB_OUTPUT"

      - id: route
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: route
          dir: ${{ steps.dir.outputs.dir }}

      - name: 判断をサマリーに出す
        run: |
          {
            echo "### route: ${{ steps.route.outputs.action }}"
            echo "- phase=\`${{ steps.route.outputs.phase }}\`"
            echo "- reason=\`${{ steps.route.outputs.reason }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------- エージェント実行と遷移
  run:
    needs: route
    if: needs.route.outputs.action != 'none'
    runs-on: ubuntu-latest
    # エージェントの上限 + 10 分。加算はハーネスが済ませている
    # （GitHub の式には算術演算子が無い）
    timeout-minutes: ${{ fromJSON(needs.route.outputs.job_timeout_minutes || '30') }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # fetch-depth: 0 は 2 つの理由から必要。
      # dev-reviewer が差分を git から読む（既定ブランチとの比較に履歴がいる）ことと、
      # push が rejected されたときの再試行（A-32）のため
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: git identity を App の bot にする
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          # origin/HEAD を張る。dev-reviewer は既定ブランチ名を知らないので
          # `git rev-parse --abbrev-ref origin/HEAD` で引けるようにしておく（main / master を問わない）
          git remote set-head origin -a

      # ---- 上限超過・版の不一致: blocked にするだけ（連鎖させない）
      - if: needs.route.outputs.action == 'block'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: block
          dir: ${{ needs.route.outputs.dir }}
          reason: ${{ needs.route.outputs.reason }}

      - name: blocked を push
        if: needs.route.outputs.action == 'block'
        run: |
          set -euo pipefail
          git commit -am "agent: blocked (${{ needs.route.outputs.reason }}) [skip ci]"
          git push

      # ---- 実行の開始を記録し、[skip ci] を付けて push（再入させない / A-36）
      - id: start
        if: needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: start
          dir: ${{ needs.route.outputs.dir }}
          agent: ${{ needs.route.outputs.agent }}
          run-id: ${{ github.run_id }}
          attempt: ${{ github.run_attempt }}
          model: ${{ needs.route.outputs.model }}

      - name: 開始を push
        if: needs.route.outputs.action == 'run'
        run: |
          set -euo pipefail
          git add -A
          git commit -m "agent: start ${{ needs.route.outputs.agent }} [skip ci]"
          git push

      # ---- 配布先のツールチェーンを用意する（中央はツールチェーンを知らない / 設計書 §4.2）
      - name: setup.sh
        if: needs.route.outputs.action == 'run'
        run: |
          set -euo pipefail
          if [ -f .agent/setup.sh ]; then
            bash .agent/setup.sh
          else
            echo "::notice::.agent/setup.sh が無いので何もしない"
          fi

      # ---- プロンプトを組み立てる（契約 §2 / §3）
      # 中央の既定プロンプトは action 自身の展開先（$GITHUB_ACTION_PATH/prompts）から読むため、
      # 中央リポジトリを別途 checkout しなくてよい
      - id: compose
        if: needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: compose
          dir: ${{ needs.route.outputs.dir }}
          agent: ${{ needs.route.outputs.agent }}

      # ---- ダミー実行（dry run）。トークンを使わずに配線だけを確認する（設計書 §9-9）
      # 成果物は契約（work/agent-contract.md §4）を満たす形で書く。dry run でも validate を通す
      - id: dummy
        if: needs.route.outputs.action == 'run' && inputs.dry_run
        env:
          D: ${{ needs.route.outputs.dir }}
          PHASE: ${{ needs.route.outputs.phase }}
          AGENT: ${{ needs.route.outputs.agent }}
        run: |
          set -euo pipefail
          SCENARIO=$(cat "$D/scenario" 2>/dev/null || echo happy)
          verdict=""

          # acceptance.json を書く。heredoc の終端子は run ブロックの基準インデントに置く
          # （case の内側に書くと字下げが残って heredoc が閉じない）
          write_acceptance() { # write_acceptance <status> <evidence(JSON 値)>
          cat > "$D/acceptance.json" <<JSON
          {
            "criteria": [
              {
                "id": "AC-1",
                "description": "ダミー",
                "verification": "manual",
                "status": "$1",
                "evidence": $2
              }
            ]
          }
          JSON
          }

          # reviews/<kind>-NN.md の数を数える。
          # ls をパイプに繋ぐと、一致するファイルが無いとき pipefail で失敗し
          # set -e がステップを殺す。glob の配列で数えれば失敗しない
          count_reviews() { # count_reviews <kind>
            local -a files=("$D/reviews/$1-"*.md)
            if [ -e "${files[0]}" ]; then echo "${#files[@]}"; else echo 0; fi
          }

          # レビュアーの verdict をシナリオで決める
          review() { # review <kind> <差し戻すか>
            local kind="$1" want_changes="$2"
            local n=$(( $(count_reviews "$kind") + 1 ))
            mkdir -p "$D/reviews"
            if [ "$want_changes" = "yes" ]; then verdict=request_changes; else verdict=approve; fi
            printf -- '---\nverdict: %s\nround: %s\nreviewer: %s\n---\n\nダミーレビュー\n' \
              "$verdict" "$n" "$AGENT" > "$D/reviews/${kind}-$(printf '%02d' "$n").md"
          }

          case "$PHASE" in
            planning)
              # 規模判定の節は planner の必須出力。「上限超過」の語が無ければ実装に進む
              printf '# ダミー計画\n\n## 規模判定\n\n- 変更ファイル数見込み: 1\n- 上限（10）以内: yes\n' > "$D/plan.md"
              write_acceptance pending null
              ;;
            plan_review)
              want=no
              if [ "$SCENARIO" = "plan-loop" ]; then want=yes; fi
              if [ "$SCENARIO" = "plan-changes" ] && [ "$(count_reviews plan)" -eq 0 ]; then want=yes; fi
              review plan "$want"
              ;;
            developing)
              mkdir -p dummy-src
              date -u > "dummy-src/change-${GITHUB_RUN_ID}.txt"
              write_acceptance passed '"ダミー実行"'
              ;;
            dev_review)
              want=no
              if [ "$SCENARIO" = "dev-changes" ] && [ "$(count_reviews dev)" -eq 0 ]; then want=yes; fi
              review dev "$want"
              ;;
            completing)
              echo "# ダミー完了報告" > "$D/completion.md"
              ;;
          esac
          echo "- dry run: phase=\`$PHASE\` agent=\`$AGENT\` verdict=\`${verdict:-なし}\`" >> "$GITHUB_STEP_SUMMARY"

      # ---- 本物のエージェント実行
      #
      # continue-on-error: true と step の timeout-minutes。失敗・タイムアウトでも
      # validate と finish を必ず通す（state を書かずに終わると run が無音で止まる）。
      # エージェントには GH_TOKEN を渡さない。GitHub の操作はハーネスが行う（A-25）
      - id: agent
        if: needs.route.outputs.action == 'run' && !inputs.dry_run
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.route.outputs.timeout_minutes || '10') }}
        uses: anthropics/claude-code-action/base-action@v1.0.215
        with:
          prompt_file: ${{ steps.compose.outputs.prompt_path }}
          # 上限とツールはハーネスが決める（契約 §5）。組み立ては src/utils/resolve-agent.ts
          claude_args: ${{ needs.route.outputs.claude_args }}
          # K-7: Console 取得まではサブスクリプション認証。WIF への差し替え手順は A-29
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # ---- 実行の結末と、検証に必要な差分の一覧を集める
      - id: outcome
        if: always() && needs.route.outputs.action == 'run'
        env:
          DRY: ${{ inputs.dry_run }}
          DUMMY_OUTCOME: ${{ steps.dummy.outcome }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -euo pipefail
          if [ "$DRY" = "true" ]; then O="$DUMMY_OUTCOME"; else O="$AGENT_OUTCOME"; fi
          [ "$O" = "success" ] || echo "agent_failed=true" >> "$GITHUB_OUTPUT"

          # developer の「差分がある」は agent-work/ を除いたコードの差分で見る
          # （acceptance.json の更新だけでは実装したことにならない）。
          # cut -c4- はポーセリン形式の XY を落とす。空白入りのパスでも壊れない
          CHANGED="$RUNNER_TEMP/changed-files.txt"
          git -c core.quotePath=false status --porcelain -uall -- . ':!agent-work' \
            | cut -c4- > "$CHANGED"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "- outcome=\`$O\` 変更ファイル数=\`$(wc -l < "$CHANGED" | tr -d ' ')\`" >> "$GITHUB_STEP_SUMMARY"

      # ---- 成果物が契約を満たすか検証する（契約 §6。ここを通れば状態機械は壊れない / K-16）
      - id: validate
        if: always() && needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: validate
          dir: ${{ needs.route.outputs.dir }}
          agent: ${{ needs.route.outputs.agent }}
          agent-failed: ${{ steps.outcome.outputs.agent_failed }}
          execution-file: ${{ steps.agent.outputs.execution_file }}
          changed-files: ${{ steps.outcome.outputs.changed }}

      # ---- 遷移を決める
      # result は validate が決める。|| の既定値は validate 自体が落ちたときの保険で、
      # 「state 更新と push は必ず行い blocked にする」という不変条件を守るため
      - id: finish
        if: always() && needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: finish
          dir: ${{ needs.route.outputs.dir }}
          record-path: ${{ steps.start.outputs.record_path }}
          result: ${{ steps.validate.outputs.result || 'invalid' }}
          detail: ${{ steps.validate.outputs.detail || 'validate が結果を返さなかった' }}
          verdict: ${{ steps.validate.outputs.verdict }}
          oversize: ${{ steps.validate.outputs.oversize }}
          acceptance-passed: ${{ steps.validate.outputs.acceptance_passed }}
          api-error-status: ${{ steps.validate.outputs.api_error_status }}
          session-id: ${{ steps.agent.outputs.session_id }}

      - name: 成果物と遷移を push
        if: always() && needs.route.outputs.action == 'run'
        run: |
          set -euo pipefail
          MSG="agent: ${{ needs.route.outputs.agent }} -> ${{ steps.finish.outputs.phase }}"
          # 終端に着いたら HEAD に [skip ci] を付けて連鎖を止める（A-36）
          if [ "${{ steps.finish.outputs.continue_chain }}" != "true" ]; then
            MSG="$MSG [skip ci]"
          fi
          git add -A
          git commit -m "$MSG"
          git push
          {
            echo "### finish: ${{ steps.finish.outputs.phase }}"
            echo "- reason=\`${{ steps.finish.outputs.reason }}\`"
            echo "- continue_chain=\`${{ steps.finish.outputs.continue_chain }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- ラベルの射影と、done なら PR の ready 化（設計書 §2.3 / §6.3）
      # 中央リポジトリの取得は成果物の push より後に行う。
      # 先に取得すると .pipeline が git add -A で配布先にコミットされてしまう
      - name: 中央リポジトリを .pipeline に取得する
        if: always() && needs.route.outputs.action != 'none'
        uses: actions/checkout@v7
        with:
          repository: satoshiarai-rgb/agent-pipeline
          ref: main
          path: .pipeline

      # ラベル操作の失敗は状態を壊さない
      - name: ラベルを phase に合わせる
        if: always() && needs.route.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_DIR: ${{ needs.route.outputs.dir }}
          CLI: ${{ github.workspace }}/.pipeline/dist/cli.js
        run: |
          set -uo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --json number -q '.[0].number' 2>/dev/null || true)
          export PR
          bash "${{ github.workspace }}/.pipeline/scripts/project-labels.sh"

      # ---- blocked なら run を失敗させる（Actions の一覧で赤く見えるようにする）
      #
      # 必ず push とラベル更新の後に置く。先に失敗させると後続がスキップされ、
      # 「state 更新と push は必ず行う」という不変条件が壊れる。
      # blocked は人間が state.json を直して push するまで進まないので、
      # 緑のまま静かに止まるより赤で気付けた方がよい
      - name: blocked を失敗として扱う
        if: always() && (needs.route.outputs.action == 'block' || steps.finish.outputs.phase == 'blocked')
        env:
          REASON: ${{ steps.finish.outputs.blocked_reason || needs.route.outputs.reason }}
        run: |
          echo "::error title=phase: blocked::$REASON"
          echo "### blocked: $REASON" >> "$GITHUB_STEP_SUMMARY"
          echo "復旧: agent-work/<run>/state.json の phase を書き換えて push する" >> "$GITHUB_STEP_SUMMARY"
          exit 1
