# ハーネスの CLI を 1 つの action として公開する。
#
# リポジトリのルートに置いているのは、$GITHUB_ACTION_PATH がリポジトリ root を指し、
# dist/cli.js に直接届くため（サブディレクトリに置くと階層を数える必要がある）。
#
# ランナーに同梱の node で dist/cli.js を実行する。npm 依存はゼロなので
# setup-node も bun のインストールも不要。dist/ は生成物だがコミットする（bun run build）。
# 既定値は src/defaults.ts としてバンドルに含まれる（データファイルではない）。

name: agent-pipeline
description: エージェントパイプラインの状態機械を操作する（start / route / finish / approve / request-changes / block / label）

inputs:
  command:
    description: "start | route | finish | approve | request-changes | block | label"
    required: true
  dir:
    description: "run のディレクトリ（agent-work/issue-<n>）"
    required: true
  # start
  agent: { description: "start: 実行するエージェント", required: false }
  run-id: { description: "start: GitHub Actions のラン ID", required: false }
  attempt: { description: "start: 再実行の回数", required: false }
  model: { description: "start: モデル（既定は src/defaults.ts の models.default）", required: false }
  # finish
  record-path: { description: "finish: start が返したレコードのパス", required: false }
  result: { description: "finish: ok | invalid | agent_failed | api_error", required: false }
  verdict: { description: "finish: approve | request_changes", required: false }
  api-error-status: { description: "finish: api_error のときの HTTP ステータス", required: false }
  oversize: { description: "finish: planner の規模判定が上限超過なら true", required: false }
  acceptance-passed: { description: "finish: acceptance.json が全 passed なら true", required: false }
  session-id: { description: "finish: base-action の session_id", required: false }
  # approve / request-changes
  association: { description: "コメント投稿者の author_association", required: false }
  body: { description: "request-changes: コメント本文", required: false }
  # block
  reason: { description: "block: blocked_reason に残す理由", required: false }

outputs:
  label:
    description: "label: いま issue に付いているべきラベル"
    value: ${{ steps.run.outputs.label }}
  issue:
    description: "label: issue 番号"
    value: ${{ steps.run.outputs.issue }}
  json:
    description: "CLI の出力全体（JSON）"
    value: ${{ steps.run.outputs.json }}
  action:
    description: "route: run | none | block"
    value: ${{ steps.run.outputs.action }}
  reason:
    description: "判断理由"
    value: ${{ steps.run.outputs.reason }}
  phase:
    description: "遷移後（route では現在）の phase"
    value: ${{ steps.run.outputs.phase }}
  total_steps:
    description: "レコード数（導出値）"
    value: ${{ steps.run.outputs.total_steps }}
  continue_chain:
    description: "finish: false なら HEAD コミットに [skip ci] を付ける"
    value: ${{ steps.run.outputs.continue_chain }}
  blocked_reason:
    description: "blocked のときの理由"
    value: ${{ steps.run.outputs.blocked_reason }}
  record_path:
    description: "start: 作成した実行レコードのパス"
    value: ${{ steps.run.outputs.record_path }}
  review_path:
    description: "request-changes: 書いたレビューファイルのパス"
    value: ${{ steps.run.outputs.review_path }}
  ok:
    description: "approve / request-changes: 遷移したかどうか"
    value: ${{ steps.run.outputs.ok }}
  agent:
    description: "route: 実行するエージェント"
    value: ${{ steps.run.outputs.agent }}
  model:
    description: "route: 使うモデル"
    value: ${{ steps.run.outputs.model }}
  max_turns:
    description: "route: --max-turns に渡す値"
    value: ${{ steps.run.outputs.max_turns }}
  timeout_minutes:
    description: "route: エージェント step の timeout-minutes"
    value: ${{ steps.run.outputs.timeout_minutes }}
  tools:
    description: "route: --tools に渡す値"
    value: ${{ steps.run.outputs.tools }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        CLI_COMMAND: ${{ inputs.command }}
        CLI_DIR: ${{ inputs.dir }}
        CLI_AGENT: ${{ inputs.agent }}
        CLI_RUN_ID: ${{ inputs.run-id }}
        CLI_ATTEMPT: ${{ inputs.attempt }}
        CLI_MODEL: ${{ inputs.model }}
        CLI_RECORD_PATH: ${{ inputs.record-path }}
        CLI_RESULT: ${{ inputs.result }}
        CLI_VERDICT: ${{ inputs.verdict }}
        CLI_API_ERROR_STATUS: ${{ inputs.api-error-status }}
        CLI_OVERSIZE: ${{ inputs.oversize }}
        CLI_ACCEPTANCE_PASSED: ${{ inputs.acceptance-passed }}
        CLI_SESSION_ID: ${{ inputs.session-id }}
        CLI_ASSOCIATION: ${{ inputs.association }}
        CLI_BODY: ${{ inputs.body }}
        CLI_REASON: ${{ inputs.reason }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-cli.sh"
