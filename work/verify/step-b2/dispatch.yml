# Step B-2: 状態機械を GitHub Actions 上で一巡させる（エージェントはダミー）
#
# 置き場所: 検証用リポジトリの .github/workflows/dispatch.yml
# 前提:
#   - Secrets に AGENT_APP_CLIENT_ID / AGENT_APP_PRIVATE_KEY
#   - 中央リポジトリ（satoshiarai-rgb/agent-pipeline）が push 済みで、
#     この検証用リポジトリから uses: で参照できること
#
# 確認したいこと:
#   1. uses: で中央の action を呼べる（$GITHUB_ACTION_PATH がリポジトリ root を指す / V-10）
#   2. route の判断がワークフローの分岐と step の引数になる
#   3. start の [skip ci] コミットで dispatch が再入しない
#   4. finalize の push で次のフェーズが自動で走る（自走ループ）
#   5. awaiting_human で止まり、/approve 相当の操作で再開する
#   6. ラウンド上限で blocked になる
#
# 使い方:
#   op=bootstrap issue=1 scenario=happy        → planning から awaiting_human まで自走
#   op=approve   issue=1                       → developing 以降が自走して done まで
#   scenario=plan-changes / dev-changes        → 差し戻しを 1 回挟む
#   scenario=plan-loop                         → 常に request_changes（ラウンド上限で blocked）

name: dispatch

on:
  workflow_dispatch:
    inputs:
      op:
        description: 手動操作
        type: choice
        default: bootstrap
        options: [bootstrap, approve]
      issue:
        description: issue 番号（検証なので実在しなくてよい）
        default: "1"
      scenario:
        description: ダミーエージェントの振る舞い
        type: choice
        default: happy
        options: [happy, plan-changes, dev-changes, plan-loop]
  push:
    branches: ["claude/**"]
    paths: ["agent-work/**"]

permissions:
  contents: write

# 同一ブランチの push を直列化する。issue イベントとはグループ名が揃わないが、
# 設計レビューで挙げた穴 2 と同じ構造で、B-2 では実害がない
concurrency:
  group: agent-${{ github.event.inputs.issue || github.ref_name }}
  cancel-in-progress: false

# 注意: uses: は ${{ }} 式を受け付けないため、中央 action の参照は各所にリテラルで書く。
# 版を上げるときは satoshiarai-rgb/agent-pipeline@main の箇所をまとめて置換する。

jobs:
  # ---------------------------------------------------------------- 手動: 起票
  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - name: git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: ブランチと state.yml を作る
        env:
          N: ${{ inputs.issue }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail
          BR="claude/issue-$N"
          if git ls-remote --exit-code --heads origin "$BR"; then
            echo "$BR は既にある（冪等）"; exit 0
          fi
          git checkout -b "$BR"
          D="agent-work/issue-$N"
          mkdir -p "$D"
          cat > "$D/state.yml" <<EOF
          # この run の状態。復旧するときは phase を書き換えて push する
          pipeline_version: 1
          issue: $N
          branch: $BR
          phase: planning
          blocked_reason: null
          updated_at: null
          EOF
          # ダミーエージェントの振る舞いもファイルで渡す（push で起動した job は
          # workflow_dispatch の入力を受け取れないため）
          echo "$SCENARIO" > "$D/scenario"
          git add "$D"
          git commit -m "agent: bootstrap issue #$N (scenario=$SCENARIO)"
          git push -u origin "$BR"   # ← ここで dispatch が起動する

  # ------------------------------------------------------------ 手動: 人間承認
  approve:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'approve'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: claude/issue-${{ inputs.issue }}
      - name: git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      - id: approve
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: approve
          dir: agent-work/issue-${{ inputs.issue }}
          association: OWNER   # 本番は github.event.comment.author_association

      - name: 承認を push（連鎖させる）
        if: steps.approve.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git commit -am "agent: approved -> ${{ steps.approve.outputs.phase }}"
          git push
      - name: 承認できなかった理由を出す
        if: steps.approve.outputs.ok != 'true'
        run: echo "::warning::${{ steps.approve.outputs.reason }}"

  # ------------------------------------------------- push: 次に何をするか決める
  route:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.route.outputs.action }}
      agent: ${{ steps.route.outputs.agent }}
      phase: ${{ steps.route.outputs.phase }}
      reason: ${{ steps.route.outputs.reason }}
      dir: ${{ steps.dir.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
      - id: dir
        run: |
          set -euo pipefail
          # ブランチ名から run のディレクトリを決める（claude/issue-1 -> agent-work/issue-1）
          echo "dir=agent-work/${GITHUB_REF_NAME#claude/}" >> "$GITHUB_OUTPUT"
      - id: route
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: route
          dir: ${{ steps.dir.outputs.dir }}
      - name: 判断をサマリーに出す
        run: |
          echo "### route: ${{ steps.route.outputs.action }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- phase=\`${{ steps.route.outputs.phase }}\` reason=\`${{ steps.route.outputs.reason }}\`" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------- push: エージェント実行と遷移
  dispatch:
    needs: route
    if: needs.route.outputs.action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}
      - name: git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      # ---- 上限超過や版の不一致: blocked にするだけ
      - id: block
        if: needs.route.outputs.action == 'block'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: block
          dir: ${{ needs.route.outputs.dir }}
          reason: ${{ needs.route.outputs.reason }}
      - name: blocked を push（連鎖させない）
        if: needs.route.outputs.action == 'block'
        run: |
          set -euo pipefail
          git commit -am "agent: blocked (${{ needs.route.outputs.reason }}) [skip ci]"
          git push

      # ---- 通常のエージェント実行
      - id: start
        if: needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: start
          dir: ${{ needs.route.outputs.dir }}
          agent: ${{ needs.route.outputs.agent }}
          run-id: ${{ github.run_id }}
          attempt: ${{ github.run_attempt }}

      - name: 開始を push（[skip ci] で再入させない）
        if: needs.route.outputs.action == 'run'
        run: |
          set -euo pipefail
          git add -A
          git commit -m "agent: start ${{ needs.route.outputs.agent }} [skip ci]"
          git push

      # ---- ダミーエージェント: 本物の代わりに echo で成果物を作る
      - id: agent
        if: needs.route.outputs.action == 'run'
        env:
          D: ${{ needs.route.outputs.dir }}
          PHASE: ${{ needs.route.outputs.phase }}
          AGENT: ${{ needs.route.outputs.agent }}
        run: |
          set -euo pipefail
          SCENARIO=$(cat "$D/scenario")
          verdict=""

          # レビュアーの verdict をシナリオで決める。
          # plan-changes / dev-changes は 1 回だけ差し戻し、plan-loop は常に差し戻す
          review() { # review <kind> <差し戻す条件>
            local kind="$1" want_changes="$2"
            local n=$(( $(ls "$D/reviews/${kind}-"*.md 2>/dev/null | wc -l) + 1 ))
            mkdir -p "$D/reviews"
            verdict=approve
            [ "$want_changes" = "yes" ] && verdict=request_changes
            printf -- '---\nverdict: %s\nround: %s\nreviewer: %s\n---\n\nダミーレビュー\n' \
              "$verdict" "$n" "$AGENT" > "$D/reviews/${kind}-$(printf '%02d' "$n").md"
          }

          case "$PHASE" in
            planning)
              echo "# ダミー計画" > "$D/plan.md"
              printf 'criteria:\n  - id: AC-1\n    description: ダミー\n    verification: manual\n    status: pending\n' > "$D/acceptance.yml"
              ;;
            plan_review)
              first=$([ -d "$D/reviews" ] && ls "$D/reviews/plan-"*.md 2>/dev/null | wc -l || echo 0)
              want=no
              [ "$SCENARIO" = "plan-loop" ] && want=yes
              [ "$SCENARIO" = "plan-changes" ] && [ "$first" -eq 0 ] && want=yes
              review plan "$want"
              ;;
            developing)
              mkdir -p dummy-src
              date -u > "dummy-src/change-${GITHUB_RUN_ID}.txt"
              printf 'criteria:\n  - id: AC-1\n    description: ダミー\n    verification: manual\n    status: passed\n    evidence: ダミー実行\n' > "$D/acceptance.yml"
              ;;
            dev_review)
              first=$(ls "$D/reviews/dev-"*.md 2>/dev/null | wc -l || echo 0)
              want=no
              [ "$SCENARIO" = "dev-changes" ] && [ "$first" -eq 0 ] && want=yes
              review dev "$want"
              ;;
            completing)
              echo "# ダミー完了報告" > "$D/completion.md"
              ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "- ダミー実行: phase=\`$PHASE\` agent=\`$AGENT\` verdict=\`${verdict:-なし}\`" >> "$GITHUB_STEP_SUMMARY"

      # ---- 遷移を決める（本番は validate の結果を渡す。ダミーは常に ok）
      - id: finish
        if: always() && needs.route.outputs.action == 'run'
        uses: satoshiarai-rgb/agent-pipeline@main
        with:
          command: finish
          dir: ${{ needs.route.outputs.dir }}
          record-path: ${{ steps.start.outputs.record_path }}
          result: ok
          verdict: ${{ steps.agent.outputs.verdict }}
          acceptance-passed: ${{ needs.route.outputs.phase == 'completing' }}

      - name: 成果物と遷移を push
        if: always() && needs.route.outputs.action == 'run'
        run: |
          set -euo pipefail
          MSG="agent: ${{ needs.route.outputs.agent }} -> ${{ steps.finish.outputs.phase }}"
          # 終端に着いたら HEAD に [skip ci] を付けて連鎖を止める（A-36）
          if [ "${{ steps.finish.outputs.continue_chain }}" != "true" ]; then
            MSG="$MSG [skip ci]"
          fi
          git add -A
          git commit -m "$MSG"
          git push
          {
            echo "### finish: ${{ steps.finish.outputs.phase }}"
            echo "- reason=\`${{ steps.finish.outputs.reason }}\`"
            echo "- continue_chain=\`${{ steps.finish.outputs.continue_chain }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
