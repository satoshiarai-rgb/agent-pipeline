# 配布先の薄いラッパー（Step B-4）
#
# 置き場所: 検証用リポジトリの .github/workflows/check-dispatch.yml
# ロジックは中央（satoshiarai-rgb/agent-pipeline）の reusable workflow にある。
# ここはイベントを受けて呼び分けるだけ。
#
# 前提: Secrets に AGENT_APP_CLIENT_ID / AGENT_APP_PRIVATE_KEY
#       （secrets: inherit で中央の reusable workflow に渡る）
#
# 使い方:
#   op=bootstrap issue=1 scenario=happy   → planning から awaiting_human まで自走
#   op=approve   issue=1                  → developing 以降が自走して done まで
#   scenario は dry run のダミーエージェントの振る舞い
#   （happy / plan-changes / dev-changes / plan-loop）
#
# C-1 / C-2 で、手動起動を issue のラベルと /approve コメントに置き換える。

name: check-dispatch

on:
  workflow_dispatch:
    inputs:
      op:
        description: 手動操作
        type: choice
        default: bootstrap
        options: [bootstrap, approve]
      issue:
        description: issue 番号（検証なので実在しなくてよい）
        default: "1"
      scenario:
        description: ダミーエージェントの振る舞い
        type: choice
        default: happy
        options: [happy, plan-changes, dev-changes, plan-loop]
  push:
    branches: ["claude/**"]
    paths: ["agent-work/**"]

permissions:
  contents: write

# 同一ブランチの push を直列化する。実行中は止めずにキューする
concurrency:
  group: agent-${{ github.event.inputs.issue || github.ref_name }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'bootstrap'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/bootstrap.yml@main
    with:
      issue: ${{ inputs.issue }}
      scenario: ${{ inputs.scenario }}
    secrets: inherit

  approve:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'approve'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/approve.yml@main
    with:
      issue: ${{ inputs.issue }}
    secrets: inherit

  dispatch:
    if: github.event_name == 'push'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/dispatch.yml@main
    with:
      dry_run: true # エージェントを呼ばずダミー成果物で配線を確認する
    secrets: inherit
