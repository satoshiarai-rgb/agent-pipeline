# 配布先の薄いラッパー（Step B-4 以降、ステップが進むごとに育つ）
#
# 置き場所: 検証用リポジトリの .github/workflows/check-dispatch.yml
# ロジックは中央（satoshiarai-rgb/agent-pipeline）の reusable workflow にある。
# ここはイベントを受けて呼び分けるだけ。
#
# 前提: Secrets に AGENT_APP_CLIENT_ID / AGENT_APP_PRIVATE_KEY
#       （secrets: inherit で中央の reusable workflow に渡る）
#
# 使い方:
#   本番の入口:
#     issue に agent:go ラベルを付ける → bootstrap（ラベルの付与には write / triage が必要）
#     draft PR にコメント → /agent approve、/agent request-changes <理由>
#   手動起動（シナリオを変えて試すため。C-1 以降も残す）:
#     op=bootstrap issue=1 scenario=plan-loop
#     op=approve   issue=1
#
# C-3 でラベルの射影（agent:planning など）と PR の ready 化を足す。

name: check-dispatch

on:
  workflow_dispatch:
    inputs:
      op:
        description: 手動操作
        type: choice
        default: bootstrap
        options: [bootstrap, approve]
      issue:
        description: issue 番号（検証なので実在しなくてよい）
        default: "1"
      scenario:
        description: ダミーエージェントの振る舞い
        type: choice
        default: happy
        options: [happy, plan-changes, dev-changes, plan-loop]
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  push:
    branches: ["claude/**"]
    paths: ["agent-work/**"]

# reusable workflow は呼び出し側より広い権限を要求できないため、
# 中央のワークフローが宣言する分をここで与える（設計書 §6.1）。
# 実際の操作は App トークンで行うので GITHUB_TOKEN はほとんど使わないが、
# 宣言は静的に検証される
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # WIF に差し替えるとき（Step E-3）に必要

# 同一ブランチの push を直列化する。実行中は止めずにキューする
concurrency:
  group: agent-${{ github.event.issue.number || github.event.inputs.issue || github.ref_name }}
  cancel-in-progress: false

jobs:
  # 本番の入口: agent:go ラベルで起動する
  bootstrap:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:go'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/bootstrap.yml@main
    with:
      issue: ${{ github.event.issue.number }}
      actor: ${{ github.actor }}
      scenario: happy # dry run のダミーエージェントの振る舞い
    secrets: inherit

  # 手動起動: シナリオを変えて試すため
  bootstrap-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'bootstrap'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/bootstrap.yml@main
    with:
      issue: ${{ inputs.issue }}
      actor: ${{ github.actor }}
      scenario: ${{ inputs.scenario }}
    secrets: inherit

  # 本番の入口: PR のコメントで承認・差し戻しを受ける（K-12 / K-13）
  # issue 側のコメントは pull_request == null で弾く。bot も無視する（A-37）
  comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/agent ')
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/comment.yml@main
    with:
      pr: ${{ github.event.issue.number }}
      body: ${{ github.event.comment.body }}
      association: ${{ github.event.comment.author_association }}
    secrets: inherit

  # 手動起動: PR を作らずに承認だけ試すため
  approve-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.op == 'approve'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/approve.yml@main
    with:
      issue: ${{ inputs.issue }}
    secrets: inherit

  dispatch:
    if: github.event_name == 'push'
    uses: satoshiarai-rgb/agent-pipeline/.github/workflows/dispatch.yml@main
    with:
      dry_run: true # エージェントを呼ばずダミー成果物で配線を確認する
    secrets: inherit
