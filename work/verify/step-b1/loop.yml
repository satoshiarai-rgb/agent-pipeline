# Step B-1: push で自分が再起動する連鎖と、その止め方
#
# 置き場所: 検証用リポジトリの .github/workflows/loop.yml
# 前提: Secrets に AGENT_APP_CLIENT_ID と AGENT_APP_PRIVATE_KEY（スモークテストで作った GitHub App）
#       AGENT_APP_CLIENT_ID は App 設定ページの Client ID（Iv23li... 形式）
#
# 学ぶこと:
#   - on: push の branches / paths フィルタ（worklist V-6）
#   - [skip ci] による連鎖の抑止（worklist V-5）
#   - concurrency
#   - 「状態はイベントのペイロードではなくファイルに置く」というこのパイプラインの原則
#     （push で起動したジョブは dispatch の入力を受け取れないので、モードもファイルに書く）
#   - **カウントは保存せず、実行ごとのファイルを作って数を導出する**
#     1 行の共有カウンタだと、並行した 2 つの更新が rebase で自動マージされ
#     「どちらのランも書いていない値」が生まれ得る。ファイルを分ければ
#     ファイル名が衝突しないので、マージは常に「両方を保持」になり取りこぼしがない
#
# 使い方: mode を選んで手動起動し、Actions タブでランが何本立つかを見る。
#   normal        → kick + step が 3 本まで連鎖して止まる（counter が 3 で停止）
#   skip-single   → [skip ci] 付きの単独コミットを push。次のランが立たないことを確認
#   skip-mixed    → [skip ci] 付きコミットと無しコミットを 1 回の push にまとめる。
#                   次のランが立つかどうかがこの検証の本題（立たないなら、start マーカーの
#                   push が失敗して finalize がまとめて push したときに run が無音で止まる）
#   outside-paths → agent-work の外だけを変更して push。paths フィルタで起動しないことを確認

name: loop-test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "何を試すか"
        type: choice
        default: normal
        options: [normal, skip-single, skip-mixed, outside-paths]
  push:
    branches: ['claude/**']      # claude/ 配下のブランチだけ
    paths: ['agent-work/**']     # かつ agent-work 配下が変更されたときだけ

permissions:
  contents: write

# 同じブランチへの push を直列化する。cancel-in-progress: false なので実行中は止めずにキューする。
# 注意: workflow_dispatch のときの ref_name は既定ブランチ（main）、push のときは claude/loop-... で、
# 同じ検証でもグループ名が変わる。これは設計レビューで挙げた「穴 2」と同じ構造で、B-1 では実害がない。
concurrency:
  group: loop-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 手動起動
  kick:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          # v3 では app-id は非推奨（Use 'client-id' instead）。
          # Client ID は App 設定ページの "Client ID"（Iv23li... 形式）で、数値の App ID とは別物。
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: git identity を App の bot にする
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          # bash の readonly 変数 UID は使わない（スモークテストで踏んだ）
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name  "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: ブランチを作って最初のレコードを push
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          BRANCH="claude/loop-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          mkdir -p agent-work/loop/runs
          echo "$MODE" > agent-work/loop/mode      # push 側はここからモードを読む
          # 実行の記録は 1 実行 1 ファイル。ファイル名にラン ID と試行回数を含めるので衝突しない
          printf 'event=%s actor=%s sha=%s at=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_ACTOR" "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > "agent-work/loop/runs/kick-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          git add agent-work
          git commit -m "loop: start (mode=$MODE)"
          git push -u origin "$BRANCH"             # ← ここで step が起動する
          echo "### kick: $BRANCH を作成（mode=$MODE）" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ push で起動
  step:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          # v3 では app-id は非推奨（Use 'client-id' instead）。
          # Client ID は App 設定ページの "Client ID"（Iv23li... 形式）で、数値の App ID とは別物。
          client-id: ${{ secrets.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - name: git identity を App の bot にする
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name  "${SLUG}[bot]"
          git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"

      - name: 実行を記録して次を起動する
        run: |
          set -euo pipefail
          MODE=$(cat agent-work/loop/mode)
          # カウントは保存値ではなく、コミット済みレコードの数から導出する
          PRIOR=$(find agent-work/loop/runs -type f | wc -l | tr -d ' ')
          REC="agent-work/loop/runs/step-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"

          echo "run: actor=${GITHUB_ACTOR} branch=${GITHUB_REF_NAME} prior_records=${PRIOR} mode=${MODE}"
          echo "- レコード数=**${PRIOR}** / mode=\`${MODE}\` / actor=\`${GITHUB_ACTOR}\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$PRIOR" -ge 3 ]; then
            echo "上限に到達したので何も push しない（連鎖はここで止まる）"
            echo "- 上限に到達 → 停止" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          write_record() {
            printf 'event=%s actor=%s sha=%s at=%s\n' \
              "$GITHUB_EVENT_NAME" "$GITHUB_ACTOR" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > "$1"
            git add "$1"
          }

          case "$MODE" in
            normal)
              write_record "$REC"
              git commit -m "loop: record $(basename "$REC")"
              ;;
            skip-single)
              write_record "$REC"
              git commit -m "loop: record $(basename "$REC") [skip ci]"
              ;;
            skip-mixed)
              # 1 回の push に [skip ci] 付きと無しのコミットを混ぜる。
              # HEAD コミットだけを見るのか、push 内の全コミットを見るのかがここで分かる。
              write_record "$REC"
              git commit -m "loop: record $(basename "$REC") [skip ci]"
              date -u > agent-work/loop/notes.txt
              git add agent-work/loop/notes.txt
              git commit -m "loop: follow-up commit (skip marker なし)"
              ;;
            outside-paths)
              # agent-work の外だけを変更する。branches は一致するが paths が一致しない
              mkdir -p docs/loop-runs
              write_record "docs/loop-runs/$(basename "$REC")"
              git commit -m "loop: agent-work の外にレコードを作成"
              ;;
          esac

          git push
          echo "- push 完了。次のランが立つかを Actions タブで確認する" >> "$GITHUB_STEP_SUMMARY"
