# bun の設定。開発ツールチェーンの依存にだけ効く（ランタイムの npm 依存はゼロ）。

[install]
# 依存は完全一致で固定する。^ による自動追従をやめ、更新はコミットとして残す
exact = true

# 公開直後の版を掴まない。npm の乗っ取り・改竄は公開から短時間で見つかって
# 取り下げられることが多いため、様子見の期間を置く（秒。604800 = 7 日）。
# 急ぎで新しい版を入れたいときは `bun add <pkg>@<version> --exact` で個別に指定するか、
# minimumReleaseAgeExcludes に該当のパッケージを挙げる
minimumReleaseAge = 604800
